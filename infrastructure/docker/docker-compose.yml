# SYNAPSE ONE - local PostgreSQL with pgvector.
# Usage (from repo root):
#   docker compose --env-file .env -f infrastructure/docker/docker-compose.yml up -d
name: synapse-one

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: synapse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is missing - copy .env.example to .env and set it}
      POSTGRES_DB: synapseone
    ports:
      # Bound to loopback only: never expose an unauthenticated database to the LAN (spec 15.1).
      - "127.0.0.1:5432:5432"
    volumes:
      - synapse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d synapseone"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  synapse_pgdata:
