[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synapse-one"
version = "0.1.0"
description = "SYNAPSE ONE - persistent, extensible AI workstation: core service, knowledge layer, and CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9,<3",
    "typer>=0.12",
    "httpx>=0.27",
    "SQLAlchemy>=2.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0",
    "alembic>=1.13",
    "sse-starlette>=2.1",
    "psutil>=6.0",
    "rich>=13.0",
    "pgvector>=0.3,<1",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
synapse = "synapse.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/synapse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# B008: function calls in argument defaults are the documented idiom for
# typer.Option/typer.Argument (CLI) and FastAPI Depends (API).
"src/synapse/cli/main.py" = ["B008"]
"src/synapse/api/auth.py" = ["B008"]
